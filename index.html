 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌍 Language Learning - HorizonTechX</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌍 Language Learning</h1>
            <p>HorizonTechX - Learn Languages Easily</p>
            <div class="sync-status" id="syncStatus">Offline (LocalStorage)</div>
        </div>
        
        <div class="language-selector">
            <button class="lang-btn active" data-lang="spanish">🇪🇸 Spanish</button>
            <button class="lang-btn" data-lang="french">🇫🇷 French</button>
            <button class="lang-btn" data-lang="german">🇩🇪 German</button>
        </div>
        
        <div class="tabs">
            <button class="tab-btn active" data-tab="learn">📚 Learn</button>
            <button class="tab-btn" data-tab="add">➕ Add Word</button>
            <button class="tab-btn" data-tab="quiz">❓ Quiz</button>
        </div>
        
        <div class="tab-content active" id="learn">
            <div id="learnContent"></div>
        </div>
        
        <div class="tab-content" id="add">
            <form id="addWordForm">
                <div class="form-group">
                    <label for="wordInput">Word / Phrase</label>
                    <input type="text" id="wordInput" placeholder="Enter word" required>
                </div>
                
                <div class="form-group">
                    <label for="meaningInput">Meaning (English)</label>
                    <input type="text" id="meaningInput" placeholder="Enter meaning" required>
                </div>
                
                <div class="form-group">
                    <label for="categorySelect">Category</label>
                    <select id="categorySelect">
                        <option value="basic">Basic</option>
                        <option value="food">Food</option>
                        <option value="travel">Travel</option>
                        <option value="greetings">Greetings</option>
                    </select>
                </div>
                
                <button type="submit" class="btn btn-primary">Add Word</button>
            </form>
        </div>
        
        <div class="tab-content" id="quiz">
            <div id="quizContent"></div>
        </div>
    </div>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"></script>
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
